<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareMap Admin Dashboard</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h2 { text-align: center; color: var(--primary); }
        .card {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .store-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .store-info div { font-size: 13px; color: #64748b; }
        .actions button {
            width: auto;
            padding: 5px 10px;
            font-size: 12px;
            margin-left: 5px;
        }
        .badge {
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .active { background: #dcfce7; color: #166534; }
        .expired { background: #fee2e2; color: #991b1b; }
        .trial { background: #fef3c7; color: #92400e; }
        .flex-row { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>ShareMap License Admin</h2>

    <!-- GitHub Config Card -->
    <div class="card">
        <h3>GitHub Settings</h3>
        <label>Personal Access Token (PAT):</label>
        <input type="password" id="githubToken" placeholder="Ilagay ang iyong GitHub Token dito">
        <button onclick="loadLicenses()">I-load ang mga Lisensya</button>
    </div>

    <!-- Add / Edit Store Card -->
    <div class="card">
        <h3>Magdagdag / Mag-update ng Store</h3>
        <label>Page Username:</label>
        <input type="text" id="storeUsername" placeholder="halimbawa: marjevinsoylucena">
        
        <label>Plan Type:</label>
        <select id="planType" onchange="autoSetExpiry()">
            <option value="TRIAL_ACCESS">7-Day Free Trial</option>
            <option value="BRONZE_MONTHLY">Bronze Monthly (P499/mo)</option>
            <option value="PLATINUM_LIFETIME">Platinum Lifetime (No Expiry)</option>
        </select>

        <label>Expiry Date (YYYY-MM-DD):</label>
        <input type="date" id="expiryDate">

        <button onclick="saveStoreLicense()" style="background-color: #16a34a;">I-save sa GitHub</button>
    </div>

    <!-- Search & Filter Card -->
    <div class="card">
        <h3>Lista ng mga Store</h3>
        <input type="text" id="searchInput" placeholder="Mag-search ng Store Username..." onkeyup="filterStores()">
        
        <div class="flex-row">
            <select id="filterStatus" onchange="filterStores()">
                <option value="all">Lahat</option>
                <option value="active">Active</option>
                <option value="trial">Trial</option>
                <option value="expired">Expired</option>
            </select>
        </div>

        <div id="storeListContainer" style="max-height: 300px; overflow-y: auto; margin-top: 10px;">
            <p style="text-align: center; color: #94a3b8;">I-load muna ang token para makita ang listahan.</p>
        </div>
    </div>
</div>

<script>
    const REPO_OWNER = "sharemap-digital-address";
    const REPO_NAME = "sendmessage-to-sellerpage";
    const FILE_PATH = "licenses.js";

    let licensesData = {};
    let fileSha = "";

    window.onload = function() {
        if(localStorage.getItem('gh_token')) {
            document.getElementById('githubToken').value = localStorage.getItem('gh_token');
            loadLicenses();
        }
        autoSetExpiry();
    };

    function autoSetExpiry() {
        let plan = document.getElementById('planType').value;
        let d = new Date();

        if (plan === "PLATINUM_LIFETIME") {
            document.getElementById('expiryDate').value = "";
            document.getElementById('expiryDate').disabled = true;
        } else {
            document.getElementById('expiryDate').disabled = false;
            let days = (plan === "TRIAL_ACCESS") ? 7 : 30;
            d.setDate(d.getDate() + days);
            document.getElementById('expiryDate').value = d.toISOString().split('T')[0];
        }
    }

    async function loadLicenses() {
        const token = document.getElementById('githubToken').value.trim();
        if(!token) {
            alert("Pakilagay muna ang iyong GitHub Personal Access Token!");
            return;
        }
        localStorage.setItem('gh_token', token);

        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
        
        try {
            let response = await fetch(url, {
                headers: { 'Authorization': `token ${token}` }
            });
            if(!response.ok) throw new Error("Nabigong basahin ang file mula sa GitHub.");
            
            let data = await response.json();
            fileSha = data.sha;
            
            let decodedContent = decodeURIComponent(escape(atob(data.content)));
            
            let start = decodedContent.indexOf('SHAREMAP_LICENSES');
            if (start !== -1) {
                let assignment = decodedContent.substring(start);
                let objectStart = assignment.indexOf('{');
                let bracketCount = 0;
                let objectEnd = -1;
                for (let i = objectStart; i < assignment.length; i++) {
                    if (assignment[i] === '{') bracketCount++;
                    else if (assignment[i] === '}') {
                        bracketCount--;
                        if (bracketCount === 0) {
                            objectEnd = i;
                            break;
                        }
                    }
                }
                
                if (objectStart !== -1 && objectEnd !== -1) {
                    let jsonString = assignment.substring(objectStart, objectEnd + 1);
                    licensesData = eval('(' + jsonString + ')');
                } else {
                    licensesData = {};
                }
            } else {
                licensesData = {};
            }
            
            renderStores(licensesData);
            alert("Tagumpay na nai-load ang mga lisensya!");
        } catch (error) {
            alert("Error sa pag-parse: " + error.message);
        }
    }

    function renderStores(data) {
        const container = document.getElementById('storeListContainer');
        container.innerHTML = "";

        let keys = Object.keys(data);
        if(keys.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: #94a3b8;">Walang nakitang account.</p>`;
            return;
        }

        let today = new Date().toISOString().split('T')[0];

        keys.forEach(username => {
            let store = data[username];
            let statusClass = "active";
            let statusText = "Active";

            if (store.expiry && today > store.expiry) {
                statusClass = "expired";
                statusText = "Expired";
            } else if (store.plan === "TRIAL_ACCESS") {
                statusClass = "trial";
                statusText = "Trial";
            }

            let expiryLabel = store.expiry ? store.expiry : "Lifetime";

            let div = document.createElement('div');
            div.className = "store-item";
            div.innerHTML = `
                <div class="store-info">
                    <strong>@${username}</strong> <span class="badge ${statusClass}">${statusText}</span>
                    <div>Plan: ${store.plan} | Expiry: ${expiryLabel}</div>
                </div>
                <div class="actions">
                    <button onclick="editStore('${username}')" style="background:#2563eb;">Edit</button>
                    <button onclick="deleteStore('${username}')" style="background:#dc2626;">Del</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function filterStores() {
        let query = document.getElementById('searchInput').value.toLowerCase();
        let statusFilter = document.getElementById('filterStatus').value;
        let today = new Date().toISOString().split('T')[0];

        let filtered = {};

        Object.keys(licensesData).forEach(username => {
            let store = licensesData[username];
            let matchName = username.toLowerCase().includes(query);
            let isExpired = store.expiry && today > store.expiry;

            let keep = true;

            if(statusFilter === "active" && (isExpired || store.plan === "TRIAL_ACCESS")) keep = false;
            if(statusFilter === "trial" && store.plan !== "TRIAL_ACCESS") keep = false;
            if(statusFilter === "expired" && !isExpired) keep = false;

            if(matchName && keep) {
                filtered[username] = store;
            }
        });

        renderStores(filtered);
    }

    function editStore(username) {
        let store = licensesData[username];
        if(store) {
            document.getElementById('storeUsername').value = username;
            document.getElementById('planType').value = store.plan;
            document.getElementById('expiryDate').value = store.expiry || "";
            if (store.plan === "PLATINUM_LIFETIME") {
                document.getElementById('expiryDate').disabled = true;
            } else {
                document.getElementById('expiryDate').disabled = false;
            }
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    }

    async function saveStoreLicense() {
        const token = document.getElementById('githubToken').value.trim();
        const username = document.getElementById('storeUsername').value.trim().toLowerCase();
        const plan = document.getElementById('planType').value;
        const expiry = (plan === "PLATINUM_LIFETIME") ? null : document.getElementById('expiryDate').value;

        if(!token || !username) {
            alert("Pakipunan ang store username.");
            return;
        }

        licensesData[username] = {
            status: "ACTIVE",
            plan: plan,
            expiry: expiry
        };

        await updateGitHubFile();
    }

    async function deleteStore(username) {
        if(!confirm(`Sigurado ka bang gusto mong tanggalin si @${username}?`)) return;

        delete licensesData[username];
        await updateGitHubFile();
    }

    async function updateGitHubFile() {
        const token = document.getElementById('githubToken').value.trim();
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

        let headerComments = `// ==========================================\n// SHAREMAP CENTRAL LICENSE DATABASE\n// ==========================================\n\n`;
        
        let accessFuncCode = `function checkShareMapAccess() {
    const urlParams = new URLSearchParams(window.location.search);
    const pageId = urlParams.get('page') || localStorage.getItem('sharemap_page');

    if (!pageId) {
        alert("⚠️ Walang natagpung Store Page ID. Hindi maiproseso ang gateway.");
        document.body.innerHTML = "<h2 style='color:red; text-align:center; margin-top:50px;'>⚠️ Invalid Gateway Link</h2>";
        return;
    }

    const license = SHAREMAP_LICENSES[pageId];
    const today = new Date().toISOString().split('T')[0];

    if (!license || license.status === "INACTIVE") {
        showBlockScreen("⚠️ Walang Lisensya / Inactive Account", "Ang store na ito ay wala pang lisensya sa ShareMap. Mangyaring makipag-ugnayan sa provider.");
        return;
    }

    if (license.expiry && today > license.expiry) {
        showBlockScreen("🚫 Expired License", \`Ang inyong \${license.plan === 'BRONZE_MONTHLY' ? 'Bronze Monthly' : 'Trial'} Access ay nag-expire noong \${license.expiry}. Paki-renew ang inyong subscription sa ShareMap.\`);
        return;
    }

    console.log(\`✅ Access Granted for \${pageId} [Plan: \${license.plan}]\`);
}`;

        let blockScreenCode = `function showBlockScreen(title, message) {
    const CONTACT_LINK = "https://m.me/sharemap.digital.address"; 

    document.body.innerHTML = \`
        <div style="background:#0f172a; color:#fff; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; font-family:sans-serif;">
            <div style="background:#1e293b; padding:30px; border-radius:12px; border:1px solid #ef4444; max-width:400px; width:90%; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
                <h2 style="color:#ef4444; margin-top:0; font-size:20px;">\${title}</h2>
                <p style="color:#cbd5e1; font-size:14px; line-height:1.5;">\${message}</p>
                
                <a href="\${CONTACT_LINK}" target="_blank" style="display:inline-block; margin-top:15px; background:#2563eb; color:#fff; text-decoration:none; padding:12px 24px; border-radius:8px; font-weight:bold; font-size:14px; width:80%;">
                    💬 Contact Developer / Renew Access
                </a>

                <hr style="border:0; border-top:1px solid #334155; margin:25px 0 15px 0;">
                <p style="font-size:11px; color:#94a3b8; margin:0;">ShareMap Licensing Protection &copy; 2026</p>
            </div>
        </div>
    \`;
}`;

        let newFileContent = headerComments + "const SHAREMAP_LICENSES = " + JSON.stringify(licensesData, null, 4) + ";\n\n" + accessFuncCode + "\n\n" + blockScreenCode;
        
        let encodedContent = btoa(unescape(encodeURIComponent(newFileContent)));

        let bodyData = {
            message: "Update SHAREMAP_LICENSES via Admin Dashboard",
            content: encodedContent,
            sha: fileSha
        };

        try {
            let response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(bodyData)
            });

            if(!response.ok) throw new Error("Nabigong i-save ang mga pagbabago sa GitHub.");

            let resJson = await response.json();
            fileSha = resJson.content.sha;
            
            renderStores(licensesData);
            alert("Tagumpay na nai-save sa GitHub!");
        } catch (error) {
            alert("Error: " + error.message);
        }
    }
</script>

</body>
</html>
